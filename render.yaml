services:
  # Backend API Service
  - type: web
    name: larp-character-manager-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd character-manager/backend && npm install --include=dev && npm run build
    startCommand: cd character-manager/backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Set in the Render dashboard. Any Postgres connection string works
      # (Render, Neon, Supabase). Without it the API falls back to in-memory
      # storage and every restart wipes the data.
      - key: DATABASE_URL
        sync: false
      # Required for this split deploy: the frontend is on a different origin,
      # and a credentialed request refuses a wildcard Access-Control-Allow-Origin.
      # Set it to the static site's full URL, e.g.
      #   https://larp-character-manager-web.onrender.com
      # Setting it also switches the session cookie to SameSite=None; Secure,
      # without which the browser will not send it cross-site.
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /api

  # Frontend Static Site
  - type: web
    name: larp-character-manager-web
    runtime: static
    buildCommand: cd character-manager/frontend && npm install --include=dev && npm run build
    staticPublishPath: character-manager/frontend/dist
    envVars:
      # Points the browser at the API's own origin, which makes every request
      # cross-site and therefore requires CORS_ORIGIN on the API service.
      #
      # The alternative below removes that requirement entirely: proxy /api
      # through this static site so the browser only ever sees one origin.
      # To use it, delete this variable and uncomment the /api rewrite --
      # with no VITE_API_URL the client calls a relative /api by default.
      - key: VITE_API_URL
        value: https://larp-character-manager-api.onrender.com/api
    routes:
      # Same-origin option. Must be listed before the SPA fallback, which
      # would otherwise swallow /api. Adjust the host to match the API
      # service's actual URL.
      # - type: rewrite
      #   source: /api/*
      #   destination: https://larp-character-manager-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
